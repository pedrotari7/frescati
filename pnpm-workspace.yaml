packages:
  - 'frontend'
  - 'backend'

allowBuilds:
  '@firebase/util': true
  # sentry-cli uploads source maps at build time. The binary normally arrives as
  # a prebuilt platform package (`@sentry/cli-darwin` and friends), and this
  # install script is only the fallback for a platform without one, but blocked
  # it warns on every install, and on that platform it would leave every stack
  # trace in Sentry minified, which is most of the value on a phone.
  '@sentry/cli': true
  # Pulled in as a peer of the Rust StyleX compiler, and nothing here calls it.
  # That transform ships as its own native binary; @swc/core is only reached
  # for `swcPlugins`, which this repo does not use. Its postinstall loads the
  # platform binding and returns, which is all it does on any platform this
  # repo builds on, and only falls back to fetching @swc/wasm through npm
  # where no binding exists. Allowed rather than left blocked because blocked
  # it warns on every install, and a warning nobody can act on is one
  # everybody stops reading.
  '@swc/core': true
  esbuild: true
  protobufjs: true
  re2: true
  sharp: true
  unrs-resolver: true

# Transitive packages with published advisories, each raised to the first fixed
# release in the major its consumers already ask for, so none of them changes
# shape underneath the package that uses it. Delete an entry once the package
# that pulls it in ships the fix itself; `pnpm audit --prod` says which.
#
# Three advisories are left alone because the fix is a new major of somebody
# else's dependency: glob 10 and 13 (14 fixes it), minimatch 9 and 10 (11), and
# uuid 8 and 9 (11). The first two only run inside the Sentry and Next build
# plugins, on our own source. uuid is reached through google-gax, which calls
# `v4()` with no buffer, and the advisory is about the buffer argument.
overrides:
  'proxy-addr@<2.0.8': ^2.0.8
  '@fastify/busboy@<3.2.2': ^3.2.2
  '@grpc/grpc-js@<1.14.5': ^1.14.5
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'fast-uri@<3.1.9': ^3.1.9
  'postcss@<8.5.23': ^8.5.23
  'source-map-js@<1.2.2': ^1.2.2
  'fast-xml-parser@<5.12.0': ^5.12.0
  'qs@<6.16.1': ^6.16.1
