name: frontend

on:
  workflow_call:
    inputs:
      isFrontend:
        required: true
        type: string

jobs:
  frontend:
    if: ${{ inputs.isFrontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          # A site key, not a secret, but absent, CI builds a bundle that sends
          # no App Check token, and this workflow only builds to prove the app
          # compiles. Vercel is where the deployed bundle gets its copy.
          NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          # Same story: public, and here so CI compiles the same shape of bundle
          # Vercel ships, with the DSN set, Sentry adds the `/monitoring` tunnel
          # rewrite, and a build that never sees one can't catch it breaking.
          # No `SENTRY_AUTH_TOKEN` on purpose, so CI uploads no source maps: this
          # build is thrown away, and releases would be attributed to it.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      # Reads the build above from both sides: every StyleX class the output
      # wears against every one the stylesheet defines. Two compilers produce
      # those halves, the Rust one inside SWC and the Babel one behind PostCSS,
      # and when they disagree the build still succeeds while the declarations
      # resolve to nothing. Nothing else here can see that: jest compiles the
      # component and its expectation with the same plugin, and the end-to-end
      # suite reads text that is still text at the wrong size.
      - run: pnpm check:stylex
      - run: pnpm --filter frontend test
