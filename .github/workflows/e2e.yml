name: e2e

on:
  workflow_call:
    inputs:
      isE2e:
        required: true
        type: string

jobs:
  # One job per viewport, each with a stack and a seeded database of its own.
  # Locally the two share one database, so `playwright.config.ts` makes desktop
  # wait for mobile. Here nothing is shared, so `--no-deps` lets them run at the
  # same time, and the e2e job takes about as long as one viewport instead of
  # both back to back. The price is a second setup and startup, about two
  # runner minutes.
  viewport:
    if: ${{ inputs.isE2e == 'true' }}
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      # A red mobile run says nothing about desktop, so let it finish.
      fail-fast: false
      matrix:
        project: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The emulators are a Java process and firebase-tools requires 21+. The
      # functions emulator is the point of this job: without it nothing writes
      # `counts`, and the headcount these tests assert on never moves.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-firebase-emulators-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      # Chromium only. These journeys are about the stack behind the screen
      # rather than browser differences, and the two viewports already cover the
      # thing that does vary: mobile is the primary target.
      - run: pnpm exec playwright install --with-deps chromium
      # The seed waits for the frontend build, and that build is the slowest
      # thing in startup. Its webpack cache keeps the unchanged half of it from
      # being redone. Keyed on the source so a hit means a matching build, and
      # restored from the nearest one otherwise.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-e2e-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.js', 'frontend/**/*.css', 'shared/**/*.ts', '!frontend/node_modules/**', '!frontend/.next/**') }}
          restore-keys: ${{ runner.os }}-e2e-next-${{ hashFiles('pnpm-lock.yaml') }}-
      # `pnpm test:e2e` starts the stack itself, through Playwright's webServer:
      # `pnpm dev:e2e` builds both halves, boots every emulator, seeds a real
      # scenario and serves the built app. The frontend build reads the
      # `NEXT_PUBLIC_*` values below out of this step's environment and inlines
      # them, which is why they are set here rather than on a build step of
      # their own.
      - run: pnpm test:e2e --project=${{ matrix.project }} --no-deps
        env:
          # Emulator-only config. Every route into Firebase goes through the
          # emulators here, so these never reach a real project, but the client
          # refuses to initialise without them. The project id has to match
          # .firebaserc, which is what the seeder writes under.
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: footballfrescati.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: footballfrescati
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: footballfrescati.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:demo
          # No App Check site key on purpose: absent, the bundle sends no token,
          # which is what the emulators expect and what the frontend job already
          # builds. No Sentry DSN either, nothing is reported from a local run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Branch protection requires a check called `e2e / e2e`, and the matrix above
  # reports as `e2e / mobile` and `e2e / desktop`. This is the one name the rule
  # waits for, red unless both viewports passed. Skipped along with them when
  # nothing the suite covers changed, which the rule counts as passing, as it
  # did when this was a single job.
  e2e:
    needs: viewport
    if: ${{ always() && inputs.isE2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.viewport.result != 'success' }}
        run: |
          echo "A viewport did not pass: ${{ needs.viewport.result }}"
          exit 1
      - run: echo "Both viewports passed."
