name: changes

on:
  workflow_call:
    outputs:
      frontend:
        value: ${{ jobs.changes.outputs.frontend }}
      backend:
        value: ${{ jobs.changes.outputs.backend }}
      shared:
        value: ${{ jobs.changes.outputs.shared }}
      rules:
        value: ${{ jobs.changes.outputs.rules }}
      e2e:
        value: ${{ jobs.changes.outputs.e2e }}
      typecheck:
        value: ${{ jobs.changes.outputs.typecheck }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
      rules: ${{ steps.filter.outputs.rules }}
      e2e: ${{ steps.filter.outputs.e2e }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'shared/**'
              # The frontend job runs this against the build it just made, and
              # `scripts/` is in no other filter, so without this line editing
              # the check is the one change that never runs it.
              - 'scripts/check-stylex-classes.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            shared:
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            rules:
              - 'firestore.rules'
              # The bucket's ruleset, checked by rules/storage.test.ts against
              # the Storage and Firestore emulators together: it decides who may
              # read a receipt by reading the season document, so a change to
              # either file can move the answer.
              - 'storage.rules'
              # Deployed config with no compiler to answer to, and the emulator
              # serves queries it does not cover, so editing it alone used to
              # run no job at all. rules/indexes.test.ts is what checks it.
              - 'firestore.indexes.json'
              # The other half of who may read a receipt. storage.rules decides
              # whether the reader is allowed the bytes, and this decides
              # whether the browser hands them over once they are. It was in no
              # filter at all, so adding an origin to it deployed nothing and
              # the origin stayed blocked. The emulator ignores CORS, so no
              # suite here can catch that. Only the deploy can.
              - 'storage.cors.json'
              - 'rules/**'
              # rules/clientWrites.test.ts drives these through the real rules,
              # so a path or shape changed here has to re-run this job, the
              # drift it exists to catch is exactly a client that moved while
              # the rules stayed put.
              - 'frontend/lib/db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            # The root tsconfig, which covers the TypeScript no package
            # compiles: `shared/` including the test files both package configs
            # exclude, the two suites that live outside any package, and the
            # root configs themselves. Every one of those runs through vitest,
            # ts-node or Playwright, all of which transpile rather than check,
            # so until this filter existed a type error in any of them was
            # invisible to every job here.
            #
            # `frontend/lib/db` is in it for the same reason the rules filter
            # has it: `rules/clientWrites.test.ts` drives the real client
            # writers through the real rules, so it imports them, and a
            # signature changed there breaks a file the frontend's own config
            # never looks at.
            typecheck:
              - 'shared/**'
              - 'e2e/**'
              - 'rules/**'
              - 'frontend/lib/db/**'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'vitest.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            # Deliberately the widest filter here: this is the only job that runs
            # the whole stack together, so any half of it moving is a reason to
            # re-check that the halves still meet.
            e2e:
              - 'frontend/**'
              - 'backend/**'
              - 'shared/**'
              - 'firestore.rules'
              - 'storage.rules'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
