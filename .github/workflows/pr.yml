name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  shared:
    needs: changes
    uses: ./.github/workflows/shared.yml
    with:
      isShared: ${{ needs.changes.outputs.shared }}

  frontend:
    needs: changes
    uses: ./.github/workflows/frontend.yml
    with:
      isFrontend: ${{ needs.changes.outputs.frontend }}

  backend:
    needs: changes
    uses: ./.github/workflows/backend.yml
    with:
      isBackend: ${{ needs.changes.outputs.backend }}

  rules:
    needs: changes
    uses: ./.github/workflows/rules.yml
    with:
      isRules: ${{ needs.changes.outputs.rules }}
  e2e:
    needs: changes
    uses: ./.github/workflows/e2e.yml
    with:
      isE2e: ${{ needs.changes.outputs.e2e }}
  typecheck:
    needs: changes
    uses: ./.github/workflows/typecheck.yml
    with:
      isTypecheck: ${{ needs.changes.outputs.typecheck }}

  # The five permissions `fallow.yml` declares, repeated here because a called
  # workflow cannot ask for more than its caller holds, and this repo's default
  # token is read-only. Getting this wrong is not a red fallow job: the whole
  # file is rejected before any job starts, so every check in here disappears
  # and the only thing that reports is Vercel. Job-level rather than top-level,
  # so the other seven jobs stay on the read-only default they need.
  fallow:
    needs: changes
    permissions:
      contents: read
      security-events: write
      id-token: write
      pull-requests: write
      checks: write
    uses: ./.github/workflows/fallow.yml
    with:
      isFallow: ${{ needs.changes.outputs.fallow }}

  format:
    uses: ./.github/workflows/format.yml
