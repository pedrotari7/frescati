name: shared

on:
  workflow_call:
    inputs:
      isShared:
        required: true
        type: string

jobs:
  shared:
    if: ${{ inputs.isShared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:shared
      - run: pnpm test
