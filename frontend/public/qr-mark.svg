<!-- The app icon, redrawn for the middle of a Swish QR code.

     Same pitch, three differences the code forces. The ground is white rather
     than the icon's near-black, because it sits on the white plate the code
     needs and a dark tile butting straight up against dark modules reads as a
     printing fault. The lines are the modules' own black rather than the app's
     green, so the mark reads as part of the code instead of a sticker on top of
     it, and nothing has to survive a scanner thresholding a mid-tone. The stroke
     is 20 rather than 14, because the whole mark is drawn at about 46 pixels and
     a 1.3 pixel line disappears there. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#ffffff"/>
  <g fill="none" stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <rect x="106" y="146" width="300" height="220" rx="14"/>
    <line x1="256" y1="146" x2="256" y2="366"/>
    <circle cx="256" cy="256" r="46"/>
    <path d="M106 206 h44 v100 h-44"/>
    <path d="M406 206 h-44 v100 h44"/>
  </g>
</svg>
